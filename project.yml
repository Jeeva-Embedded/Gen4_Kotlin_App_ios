name: Gen4Spinning

options:
  bundleIdPrefix: in.gen4.spinning
  deploymentTarget:
    iOS: "16.0"

settings:
  SWIFT_VERSION: "5.9"

targets:
  Gen4Spinning:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Gen4Spinning
    info:
      path: Gen4Spinning/Info.plist
      properties:
        CFBundleDisplayName: Gen4 Spinning
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: "Gen4 Spinning uses Bluetooth to communicate with spinning machines."
        NSBluetoothPeripheralUsageDescription: "Gen4 Spinning uses Bluetooth to communicate with spinning machines."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.gen4.spinning.app
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
    dependencies:
      - sdk: CoreBluetooth.framework
